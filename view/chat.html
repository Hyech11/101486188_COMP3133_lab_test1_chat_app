<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        #chat-container { display: none; }
        #messages { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; }
        .system-msg { color: orangered; font-style: italic; }
        .my-msg { text-align: right; color: skyblue; }
        .other-msg { text-align: left; color: black; }
    </style>
</head>
<body class="container mt-4">

<div id="room-selection">
    <h3>Select a Room</h3>
    <h4 id="welcome-msg"></h4>
    <select id="room" class="form-control mb-2">
        <option value="devops">DevOps</option>
        <option value="cloud computing">Cloud Computing</option>
        <option value="covid19">Covid19</option>
        <option value="sports">Sports</option>
        <option value="nodeJS">NodeJS</option>
    </select>
    <button id="joinBtn" class="btn btn-success">Join Room</button>
    <button id="logoutBtn" class="btn btn-danger float-right">Logout</button>
</div>

<div id="chat-container">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h3 id="room-name"></h3>
        <button id="leaveBtn" class="btn btn-warning">Leave Room</button>
    </div>

    <div id="messages"></div>
    <p id="typing-indicator" class="text-muted small"></p>

    <div class="input-group mt-2">
        <input type="text" id="msgInput" class="form-control" placeholder="Type message...">
        <div class="input-group-append">
            <button id="sendBtn" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    const socket = io();
    const username = localStorage.getItem('username');

    if (!username) {
        alert("Please login first");
        window.location.href = 'login.html';
    }

    $('#welcome-msg').text(`Welcome, ${username}`);

    $('#joinBtn').click(() => {
        const room = $('#room').val();
        $('#room-selection').hide();
        $('#chat-container').show();
        $('#room-name').text(`Room: ${room}`);
        $('#messages').html(''); // 이전 메시지 초기화

        socket.emit('joinRoom', { username, room });
    });

    $('#leaveBtn').click(() => {
        const room = $('#room').val();
        socket.emit('leaveRoom', { username, room });
        $('#chat-container').hide();
        $('#room-selection').show();
    });

    $('#logoutBtn').click(() => {
        localStorage.removeItem('username');
        window.location.href = 'login.html';
    });

    $('#sendBtn').click(() => {
        const message = $('#msgInput').val();
        const room = $('#room').val();
        if(message.trim() !== "") {
            socket.emit('chatMessage', { from_user: username, room, message });
            $('#msgInput').val('');
            socket.emit('stopTyping', { room });
        }
    });

    socket.on('message', (data) => {
        let msgClass = 'other-msg';
        if (data.from_user === username) msgClass = 'my-msg';
        if (data.from_user === 'System') msgClass = 'system-msg';

        const html = `<div class="${msgClass}">
                            <strong>${data.from_user}:</strong> ${data.message}
                          </div>`;
        $('#messages').append(html);
        $('#messages').scrollTop($('#messages')[0].scrollHeight);
    });

    // 타이핑 인디케이터 처리
    let typingTimeout;
    $('#msgInput').on('input', () => {
        const room = $('#room').val();
        socket.emit('typing', { username, room });

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('stopTyping', { room });
        }, 1000);
    });

    socket.on('typing', (user) => {
        $('#typing-indicator').text(`${user} is typing...`);
    });

    socket.on('stopTyping', () => {
        $('#typing-indicator').text('');
    });

</script>
</body>
</html>
